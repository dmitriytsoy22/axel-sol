[package]
name = "axel-v2"
version = "0.1.0"
description = "AXEL v2: tokenized taxi cars with escrowed raises and exact revenue accounting"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "axel_v2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_2022_extensions", "associated_token"] }
spl-discriminator = "0.4"
spl-token-2022 = { version = "8", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "0.10"
spl-transfer-hook-interface = "0.10"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
